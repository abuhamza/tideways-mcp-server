# Hosts that jobs on GitHub's egress-firewall runner (runs-on: ubuntu-24.04-firewall) may reach.
# Only the Claude review job runs there. Everything else is blocked, apart from the hosts GitHub
# allows by default (github.com, codeload.github.com, *actions.githubusercontent.com and
# *blob.core.windows.net). Add a host only when a step needs it, name it in full and say what uses it.
mode: enforce
allow:
  # Claude API: model requests, the auto-mode safety review, and trading the job's GitHub OIDC
  # token for the Claude GitHub App's token
  - api.anthropic.com
  # GitHub API: the Claude Code action, gh in the review, and its inline comments
  - api.github.com
  # Claude Code install script and binary, fetched by the Claude Code action
  - claude.ai
  - downloads.claude.ai
  # Bun release download (oven-sh/setup-bun in the Claude Code action)
  - release-assets.githubusercontent.com
  # The Claude Code action's npm dependencies (bun install)
  - registry.npmjs.org
  # step-security/harden-runner: policy and telemetry
  - agent.api.stepsecurity.io
  - prod.app-api.stepsecurity.io
