name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    name: Claude review
    if: >-
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'release-please--')
    # Claude runs in auto permission mode (see claude_args), so the job runs on GitHub's
    # egress-firewall runner, which blocks hosts outside .github/egress-firewall.yaml.
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    # No harden-runner here: its DNS resolves over HTTPS through 1.1.1.1 and 8.8.8.8, which the
    # firewall blocks, so every lookup in the job fails. The firewall covers its role in this job.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so review agents can run `git diff origin/main...HEAD`.
          fetch-depth: 0
          persist-credentials: false

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7 # v1.0.237
        env:
          # The action ends the run at the first result message, which kills background
          # subagents before the plugin gets to review or comment (the job still passes).
          # Foreground subagents keep the whole review inside one turn.
          # https://github.com/anthropics/claude-code-action/issues/1499
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          # The Claude App token defaults to write access to contents, issues and pull requests.
          # The review only comments (pull requests: write covers PR comments), so its token
          # cannot push.
          additional_permissions: |
            contents: read
            issues: read
          # The tools the plugin's command declares, plus Skill so the command itself can load.
          # --permission-mode auto: shell and network calls outside this list run only if Claude
          # Code's safety review passes them. In the default mode a CI run, with nobody to ask,
          # refuses those it cannot judge read-only, such as git log --format='--- %h'.
          claude_args: >-
            --permission-mode auto
            --allowedTools "Skill,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr comment:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),mcp__github_inline_comment__create_inline_comment"
            --append-system-prompt "This is a non-interactive CI run: ending your turn ends the run. Follow every numbered step of the review command and launch every subagent it names; do not replace a subagent's review with your own reading. Run subagents in the foreground and wait for their results. Do not schedule wakeups. The checkout has full history and origin/main, so git diff origin/main...HEAD shows the pull request's changes. Do not end your turn while a subagent is running or before the command's last step has run."

      # The job log does not show the permission mode, and a session that cannot use auto mode
      # starts in the default mode without saying so.
      - name: Show the review's permission mode
        if: always() && steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          jq -r '.[] | select(.type == "system" and .subtype == "init") | "Permission mode: \(.permissionMode)"' "$EXECUTION_FILE"
