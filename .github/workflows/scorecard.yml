# Based on the official OpenSSF Scorecard starter workflow.
# publish_results: true imposes restrictions (https://github.com/ossf/scorecard-action#workflow-restrictions):
# no top-level env/defaults, no workflow-level write permissions, id-token only on this job, and only
# checkout / upload-artifact / upload-sarif / scorecard-action / harden-runner steps in the job.
name: Scorecard supply-chain security

on:
  # For the Branch-Protection check. Only the default branch is supported.
  branch_protection_rule:
  # Keeps the Maintained check fresh.
  schedule:
    - cron: "33 5 * * 1" # weekly, Monday 05:33 UTC
  push:
    branches: [main]

# Default permissions read-only (the upstream template uses `read-all`; the job below declares its own grants).
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # publish_results only works when run from the default branch.
    if: github.event.repository.default_branch == github.ref_name || github.event_name == 'pull_request'
    permissions:
      # Upload the results to the code-scanning dashboard.
      security-events: write
      # Publish results to the OpenSSF REST API and get a badge.
      id-token: write
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Uncomment to enable the Branch-Protection check on a public repo (fine-grained PAT,
          # see https://github.com/ossf/scorecard-action#authentication-with-fine-grained-pat-optional).
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.sarif
